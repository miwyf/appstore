services:
  headscale:
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      1panel-network:
        ipv4_address: ${SUBNET}
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    volumes:
      - "./data/config:/etc/headscale"
      - "./data/data:/var/lib/headscale"
    command: serve
    image: headscale/headscale:v0.26.1
    labels:  
      createdBy: "Apps"

networks:  
  1panel-network:  
    external: true
