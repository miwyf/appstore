services:
  sublinkx:
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8000"
    volumes:
      - ./data/db:/app/db
      - ./data/template:/app/template
      - ./data/logs:/app/logs
    image: jaaksi/sublinkx:latest
    labels:  
      createdBy: "Apps"

networks:  
  1panel-network:  
    external: true
