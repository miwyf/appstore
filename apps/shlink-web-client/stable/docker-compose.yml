services:
  shlinkc:
    image: shlinkio/shlink-web-client:stable
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    environment:
      - SHLINK_SERVER_URL=${SHLINK_SERVER_URL}
      - SHLINK_SERVER_API_KEY=${SHLINK_SERVER_API_KEY}
    labels:  
      createdBy: "Apps"

networks:  
  1panel-network:  
    external: true
