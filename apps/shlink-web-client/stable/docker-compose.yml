services:
  shlinkc:
    image: shlinkio/shlink-web-client:stable
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    volumes:
      - ${DATA_PATH}/servers.json:/usr/share/nginx/html/servers.json
    labels:  
      createdBy: "Apps"

networks:  
  1panel-network:  
    external: true
